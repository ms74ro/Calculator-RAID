<style>
:root{
  --bg:#E6EAEE; --panel:#F6F8FA; --ink:#1B2632; --muted:#5A6774; --line:#CBD3DB;
  --chassis:#2B333C; --chassis-2:#3A444F; --sled:#46515D; --sled-ink:#DDE4EA;
  --data:#2E7DA6; --prot:#D58F22; --unused:#9AA6B2; --led:#46C985; --warn-bg:#FBF0DC; --warn-ink:#7A4E0B;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A20; --panel:#1C242C; --ink:#E2E8EE; --muted:#95A3B0; --line:#2F3A45;
    --chassis:#0E1318; --chassis-2:#1E262E; --sled:#2A333D; --sled-ink:#C9D3DC;
    --data:#4C9DCA; --prot:#E3A645; --unused:#5F6B77; --warn-bg:#3A2C14; --warn-ink:#F1C987;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A20; --panel:#1C242C; --ink:#E2E8EE; --muted:#95A3B0; --line:#2F3A45;
  --chassis:#0E1318; --chassis-2:#1E262E; --sled:#2A333D; --sled-ink:#C9D3DC;
  --data:#4C9DCA; --prot:#E3A645; --unused:#5F6B77; --warn-bg:#3A2C14; --warn-ink:#F1C987;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background-color .2s,color .2s}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--data);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 56px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
header h1{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,5vw,3.4rem);line-height:1;margin:0 0 6px;letter-spacing:.01em}
header p{margin:0;color:var(--muted);max-width:62ch}
.toolbar{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.theme-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;border-radius:7px;padding:6px 11px;cursor:pointer;font-weight:500;font-size:.9rem}
.theme-btn:hover,.seg:hover{border-color:var(--data)}
.theme-btn svg{width:16px;height:16px}

.top{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;margin-top:26px;align-items:start}
@media (max-width:900px){.top{grid-template-columns:1fr}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
h2{font-family:var(--display);font-weight:600;font-size:1.45rem;margin:0 0 12px;line-height:1.1}
h3{font-size:.95rem;font-weight:600;margin:0 0 8px;color:var(--muted)}

.picker-row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 9px;cursor:pointer;font-weight:500;font-variant-numeric:tabular-nums;min-width:52px}
.chip:hover{border-color:var(--data)}
.chip[aria-pressed="true"]{background:var(--data);border-color:var(--data);color:#fff}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl label{color:var(--muted);font-size:.92rem}
select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.btn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--data)}

.chassis{margin-top:16px;background:linear-gradient(180deg,var(--chassis-2),var(--chassis) 18%);border-radius:14px;padding:16px 16px 18px;display:grid;grid-template-columns:44px 1fr;gap:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.front{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:6px}
.power{width:22px;height:22px;border-radius:50%;border:2px solid #6E7A86;display:grid;place-items:center}
.power::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--led);box-shadow:0 0 8px var(--led)}
.front .model{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-weight:600;color:#8C98A4;letter-spacing:.08em;font-size:.95rem}
.bays{display:grid;gap:8px}
.sled{position:relative;height:200px;border-radius:7px;background:var(--sled);border:1px solid rgba(255,255,255,.06);padding:22px 6px 26px;cursor:pointer;display:flex;flex-direction:column;color:var(--sled-ink);transition:transform .15s}
.sled:hover{transform:translateY(-2px)}
.sled::before{content:"";position:absolute;top:8px;left:22%;right:22%;height:5px;border-radius:3px;background:rgba(255,255,255,.14)}
.sled .led{position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--led);box-shadow:0 0 6px var(--led)}
.sled .fill{flex:1;display:flex;flex-direction:column-reverse;border-radius:4px;overflow:hidden;background:rgba(0,0,0,.25)}
.sled .fill span{display:block;transition:flex-grow .35s ease}
.seg-data{background:var(--data)}
.seg-prot{background:var(--prot)}
.seg-unused{background:repeating-linear-gradient(135deg,var(--unused) 0 4px,transparent 4px 8px)}
.sled .size{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-family:var(--display);font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums}
.sled.empty{background:transparent;border:1.5px dashed #5C6773}
.sled.empty::before,.sled.empty .led{display:none}
.sled.empty .size{color:#7D8995;font-weight:500;font-size:.9rem;bottom:auto;top:50%;transform:translateY(-50%)}
.sled.out .led{background:#6E7A86;box-shadow:none}
.hint{color:var(--muted);font-size:.88rem;margin:10px 0 0}

.levels{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.lvl{border:1px solid var(--line);background:transparent;border-radius:6px;padding:6px 10px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:1.05rem}
.lvl[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.lvl.invalid{opacity:.45}
.usable{font-family:var(--display);font-weight:700;font-size:clamp(3rem,7vw,4.4rem);line-height:.95;font-variant-numeric:tabular-nums}
.usable small{font-size:.42em;font-weight:600;margin-left:4px}
.tib{color:var(--muted);font-size:.92rem;margin:4px 0 14px}
.bar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--line)}
.bar span{transition:flex-grow .35s ease}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 14px;margin:14px 0 0;font-variant-numeric:tabular-nums}
.stats dt{display:flex;align-items:center;gap:8px;color:var(--muted)}
.stats dd{margin:0;text-align:right;font-weight:600}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.stats .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:4px 0}
.desc{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.desc p{margin:0 0 6px}
.ft{font-weight:600}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:6px;padding:8px 11px;font-size:.92rem;margin-top:8px}
.invalid-msg{font-size:1.05rem;color:var(--muted);margin:6px 0 10px}
.groups{display:none;margin:-4px 0 14px}
.groups.show{display:flex}

.compare{margin-top:22px}
.compare-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.compare-head p{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:900px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.85rem;font-weight:600;color:var(--muted);white-space:nowrap}
td.num,th.num{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover{background:color-mix(in srgb,var(--data) 7%,transparent)}
tbody tr.sel{background:color-mix(in srgb,var(--data) 14%,transparent)}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--data)}
tbody tr.na td{color:var(--muted)}
.lvname{font-family:var(--display);font-weight:600;font-size:1.1rem;white-space:nowrap}
.lvname span{font-family:var(--body);font-weight:500;font-size:.85rem;color:var(--muted)}
.minibar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--line);min-width:140px}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--ink)}
.na-reason{font-size:.88rem}
.notes{margin-top:22px;color:var(--muted);font-size:.9rem;max-width:80ch}
.notes p{margin:0 0 6px}
footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.88rem}
@media (max-width:560px){
  .wrap{padding:20px 14px 40px}
  .sled{height:160px}
  .chassis{grid-template-columns:30px 1fr;padding:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="wrap">
  <header>
    <div>
      <h1 data-i18n="title"></h1>

      <div class="seg" role="group" id="langSeg">

  <div class="top">

        <div class="ctrl">
          <label for="bays" data-i18n="baysLabel"></label>
          <select id="bays"></select>
        </div>
        <div class="ctrl">
          <button class="btn" id="fill" data-i18n="fill"></button>
          <button class="btn" id="reset" data-i18n="clear"></button>

      <h3 data-i18n="addDrive"></h3>

    <section class="panel" aria-labelledby="h-rez">

      <div class="levels" id="levels" role="group"></div>

        <label for="groups" data-i18n="subgroups"></label>
        <select id="groups"></select>
      </div>
      <div id="result" aria-live="polite"></div>

  </div>

  <section class="panel compare" aria-labelledby="h-comp">
    <div class="compare-head">
      <h2 id="h-comp" data-i18n="compare"></h2>
      <p id="compSub"></p>

    <div class="scroll">
      <table>
        <thead>

            <th class="num" data-i18n="thUsable"></th>
            <th class="num" data-i18n="thProt"></th>
            <th class="num" data-i18n="thUnused"></th>
            <th class="num" data-i18n="thEff"></th>
            <th data-i18n="thDist"></th>
            <th data-i18n="thFt"></th>
            <th data-i18n="thRead"></th>
            <th data-i18n="thWrite"></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <div class="notes">
    <p data-i18n="note1"></p>
    <p data-i18n="note2"></p>
    <p data-i18n="note3"></p>
  </div>
  <footer>© 2026 ms74ro</footer>
</div>

  desc:{
   JBOD:'Discurile sunt legate unul după altul, fără protecție. Folosește toată capacitatea, chiar și la discuri diferite.',
   '0':'Datele sunt împărțite pe toate discurile. Cea mai mare viteză și tot spațiul, dar un singur disc defect înseamnă pierderea tuturor datelor.',
   '1':'Oglindire: fiecare disc are o copie completă a datelor. Simplu și sigur, dar spațiul util e cât un singur disc.',
   '5':'Paritate distribuită pe toate discurile. Pierzi un disc pentru protecție și supraviețuiești defectării unuia singur.',
   '6':'Paritate dublă. Pierzi două discuri pentru protecție, dar volumul rezistă la defectarea oricăror două discuri.',
   '10':'Perechi oglindite, apoi împărțire pe perechi. Viteză mare și reconstrucție rapidă, cu jumătate din spațiu folosit pentru protecție.',

   '60':'Mai multe grupuri RAID 6 combinate în RAID 0. Pentru multe discuri: rezistă la câte două discuri defecte în fiecare grup.'

 },
 en:{
  locale:'en-US', title:'RAID Calculator',
  intro:'Put drives in the NAS, pick a RAID level and see how much usable space you get. The table below compares every level for the same drives.',
  dark:'Dark', light:'Light', toDark:'Switch to dark mode', toLight:'Switch to light mode',

  result:'Result', subgroups:'Subgroups', compare:'RAID level comparison',
  thLevel:'Level', thUsable:'Usable space', thProt:'Protection', thUnused:'Unused', thEff:'Efficiency',
  thDist:'Breakdown', thFt:'Drives that can fail', thRead:'Read', thWrite:'Write',
  note1:'Capacities are in decimal TB, the way drives are sold. Operating systems show TiB, roughly 9% less, and the file system and NAS also take a small share of the space.',
  note2:'With mixed drive sizes, RAID 0, 1, 5, 6, 10, 50 and 60 only use as much of each drive as the smallest one holds; the rest shows as unused. Speeds are approximate, relative to a single drive.',
  note3:'RAID is not a backup: it protects you from a drive failure, not from accidental deletion, ransomware or losing the whole NAS.',
  disk:n=>n===1?'drive':'drives', bay:n=>n===1?'bay':'bays',
  empty:'empty', ariaEmpty:(i,s)=>`Bay ${i} empty, add ${s} TB`, ariaDrive:(i,s)=>`Bay ${i}: ${s} TB, click to remove`,
  sizeGroup:'Drive capacity', levelGroup:'RAID level', langGroup:'Language',

  noGroups:(n,p)=>`${n} drives can't be split into equal groups of at least ${p}`,
  ftJbod:'0 — one failed drive can take down the whole volume',
  ft0:'0 — any failed drive means losing all data',
  ft1:n=>`${n-1} of ${n}`, ft5:'1 drive', ft6:'Any 2 drives',
  ft10:n=>n>4?`1 guaranteed, up to ${n/2} if in different pairs`:'1 guaranteed, 2 if in different pairs',
  ftNested:(pg,p,g)=>`${pg} guaranteed, up to ${p} (${pg} in each of the ${g} groups)`,
  wRaid1:'On ASUSTOR NAS units, RAID 1 supports at most 2 drives.',
  w16:'On ASUSTOR NAS units, a single RAID 0, 5, 6 or 10 volume supports at most 16 drives.',
  wRebuild:'With large drives, a rebuild after a failure can take a day or more, and a second failure during that time destroys the volume. RAID 6 is safer here.',
  wMixed:v=>`Drives are different sizes: ${v} TB goes unused.`,
  groupOpt:(g,k)=>`${g} groups of ${k} drives`,
  addFirst:'Add drives to the NAS to see the available space.',
  invalid:(name,reason,n)=>`${name} ${reason}. You have ${n} ${n===1?'drive':'drives'}.`,
  usable:'TB usable', tib:(v,e)=>`≈ ${v} TiB shown by the OS, ${e}% of total capacity`,
  sAvail:'Available space', sProt:'Used for protection', sUnused:'Unused',
  sTotal:'Total drive capacity', sCount:'Number of drives',
  ftLine:'Drives that can fail without data loss:',
  compSub:(n,t)=>`For ${n} ${n===1?'drive':'drives'}, ${t} TB total. Click a row to select it.`,
  compEmpty:'Add drives to compare the levels.',
  unavailable:'Unavailable:', noDrives:'no drives', groupsShort:'gr.', of5:n=>`${n} of 5`,
  desc:{
   JBOD:'Drives are chained one after another with no protection. Uses all capacity, even with mixed sizes.',
   '0':'Data is striped across all drives. Fastest and uses all space, but one failed drive means losing everything.',
   '1':'Mirroring: every drive holds a full copy of the data. Simple and safe, but usable space equals one drive.',
   '5':'Parity spread across all drives. You give up one drive for protection and survive a single drive failure.',
   '6':'Double parity. You give up two drives for protection, and the volume survives any two drive failures.',
   '10':'Mirrored pairs, striped together. Fast with quick rebuilds, with half the space used for protection.',
   '50':'Several RAID 5 groups striped as RAID 0. Faster than one big RAID 5 and survives one failed drive per group.',

 }

const LEVELS=[
 {id:'JBOD',name:'JBOD',min:1,read:1,write:1},
 {id:'0',name:'RAID 0',min:2,read:5,write:5},
 {id:'1',name:'RAID 1',min:2,read:3,write:2},
 {id:'5',name:'RAID 5',min:3,read:4,write:2},
 {id:'6',name:'RAID 6',min:4,read:4,write:1},
 {id:'10',name:'RAID 10',min:4,read:5,write:4},
 {id:'50',name:'RAID 50',min:6,read:4,write:3,per:3},
 {id:'60',name:'RAID 60',min:8,read:4,write:2,per:4}
];

let state={bays:4,drives:[8,8,8,8],level:'5',size:8,groups:{},lang:'ro'};
try{const s=JSON.parse(localStorage.getItem('raidcalc'));if(s&&Array.isArray(s.drives))state=Object.assign(state,s)}catch(e){}
if(!I18N[state.lang]) state.lang='ro';
function save(){try{localStorage.setItem('raidcalc',JSON.stringify(state))}catch(e){}}

let T=I18N[state.lang];
const fmt=(v,d)=>v.toLocaleString(T.locale,{maximumFractionDigits:d==null?2:d});
const $=id=>document.getElementById(id);

/* theme */
const mq=window.matchMedia('(prefers-color-scheme: dark)');
function isDark(){const a=document.documentElement.getAttribute('data-theme');return a?a==='dark':mq.matches}
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function renderThemeBtn(){
  const d=isDark(), b=$('themeBtn');
  b.innerHTML=(d?SUN:MOON)+`<span>${d?T.light:T.dark}</span>`;
  b.setAttribute('aria-label',d?T.toLight:T.toDark);
}
$('themeBtn').addEventListener('click',()=>{
  const next=isDark()?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('raidcalc-theme',next)}catch(e){}
  renderThemeBtn();
});
mq.addEventListener&&mq.addEventListener('change',renderThemeBtn);

/* calc */
function validGroups(lv,n){const out=[];for(let g=2;g<=Math.floor(n/lv.per);g++) if(n%g===0) out.push(g);return out}

function calc(lv,sizes){
  const n=sizes.length, total=sizes.reduce((a,b)=>a+b,0);
  const r={lv,n,total,usable:0,prot:0,unused:0,valid:true,reason:'',per:[],ft:'',warn:[]};
  if(n<lv.min){r.valid=false;r.reason=T.needMin(lv.min);return r}
  const min=Math.min(...sizes);
  let p=0;
  switch(lv.id){
    case 'JBOD': r.usable=total;r.per=sizes.map(s=>({d:s,p:0,u:0}));r.ft=T.ftJbod;return r;
    case '0': p=0; r.ft=T.ft0; break;
    case '1': p=n-1; r.ft=T.ft1(n); if(n>2) r.warn.push(T.wRaid1); break;
    case '5': p=1; r.ft=T.ft5; break;
    case '6': p=2; r.ft=T.ft6; break;
    case '10':
      if(n%2){r.valid=false;r.reason=T.needEven;return r}
      p=n/2; r.ft=T.ft10(n); break;
    case '50': case '60': {
      const opts=validGroups(lv,n);
      if(!opts.length){r.valid=false;r.reason=T.noGroups(n,lv.per);return r}
      const g=opts.includes(state.groups[lv.id])?state.groups[lv.id]:opts[0];
      r.groups=g;r.groupOpts=opts;
      const pg=lv.id==='50'?1:2; p=g*pg; r.ft=T.ftNested(pg,p,g); break;
    }
  }
  r.usable=(n-p)*min; r.prot=p*min; r.unused=total-n*min;
  r.per=sizes.map(s=>({d:min*(n-p)/n,p:min*p/n,u:s-min}));
  if(n>16 && ['0','5','6','10'].includes(lv.id)) r.warn.push(T.w16);
  if((lv.id==='5'||lv.id==='50') && min>=8) r.warn.push(T.wRebuild);
  if(r.unused>0) r.warn.push(T.wMixed(fmt(r.unused)));
  return r;
}

/* static */
function buildStatic(){
  $('bays').innerHTML=BAY_OPTS.map(b=>`<option value="${b}">${b}</option>`).join('');
  $('chips').innerHTML=SIZES.map(s=>`<button class="chip" data-size="${s}">${s} TB</button>`).join('');
  $('levels').innerHTML=LEVELS.map(l=>`<button class="lvl" data-level="${l.id}">${l.name}</button>`).join('');
}
function applyLang(){
  T=I18N[state.lang];
  document.documentElement.lang=state.lang;
  document.title=T.title;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=T[el.dataset.i18n]});
  $('chips').setAttribute('aria-label',T.sizeGroup);
  $('levels').setAttribute('aria-label',T.levelGroup);
  $('langSeg').setAttribute('aria-label',T.langGroup);
  document.querySelectorAll('#langSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===state.lang));
  renderThemeBtn();
}

const sizesNow=()=>state.drives.filter(d=>d!=null);

function renderBays(res){
  const b=state.bays, cols=b<=6?b:(b<=12?6:8), grid=$('baysGrid');
  grid.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
  $('model').textContent=`${b} ${T.bay(b)}`;
  let k=0;
  grid.innerHTML=state.drives.map((d,i)=>{
    if(d==null) return `<button class="sled empty" data-bay="${i}" aria-label="${T.ariaEmpty(i+1,state.size)}"><span class="size">${T.empty}</span></button>`;
    const per=res.valid?res.per[k]:{d:0,p:0,u:d}; k++;
    return `<button class="sled${res.valid?'':' out'}" data-bay="${i}" aria-label="${T.ariaDrive(i+1,d)}">
      <span class="led"></span>
      <span class="fill"><span class="seg-data" style="flex-grow:${per.d}"></span><span class="seg-prot" style="flex-grow:${per.p}"></span><span class="seg-unused" style="flex-grow:${per.u}"></span></span>
      <span class="size">${d} TB</span></button>`;
  }).join('');
}

function bar(r,cls){
  if(!r.valid||!r.total) return `<div class="${cls}"></div>`;
  return `<div class="${cls}"><span class="seg-data" style="flex-grow:${r.usable}"></span><span class="seg-prot" style="flex-grow:${r.prot}"></span><span class="seg-unused" style="flex-grow:${r.unused}"></span></div>`;
}

function renderResult(r){
  const lv=r.lv, el=$('result'), gw=$('groupsWrap');
  if(r.valid && r.groupOpts){
    gw.classList.add('show');
    $('groups').innerHTML=r.groupOpts.map(g=>`<option value="${g}" ${g===r.groups?'selected':''}>${T.groupOpt(g,r.n/g)}</option>`).join('');
  } else gw.classList.remove('show');
  if(!r.n){el.innerHTML=`<p class="invalid-msg">${T.addFirst}</p>`;return}
  if(!r.valid){el.innerHTML=`<p class="invalid-msg">${T.invalid(lv.name,r.reason,r.n)}</p><div class="desc"><p>${T.desc[lv.id]}</p></div>`;return}
  const eff=r.total?Math.round(r.usable/r.total*100):0;
  el.innerHTML=`
    <div class="usable">${fmt(r.usable)}<small>${T.usable}</small></div>
    <div class="tib">${T.tib(fmt(r.usable*TIB),eff)}</div>
    ${bar(r,'bar')}
    <dl class="stats">
      <dt><span class="sw seg-data"></span>${T.sAvail}</dt><dd>${fmt(r.usable)} TB</dd>
      <dt><span class="sw seg-prot"></span>${T.sProt}</dt><dd>${fmt(r.prot)} TB</dd>
      <dt><span class="sw seg-unused"></span>${T.sUnused}</dt><dd>${fmt(r.unused)} TB</dd>
      <div class="sep"></div>
      <dt>${T.sTotal}</dt><dd>${fmt(r.total)} TB</dd>
      <dt>${T.sCount}</dt><dd>${r.n}</dd>
    </dl>
    <div class="desc">
      <p>${T.desc[lv.id]}</p>
      <p>${T.ftLine} <span class="ft">${r.ft}</span></p>
      ${r.warn.map(w=>`<div class="warn">${w}</div>`).join('')}
    </div>`;
}

const dots=n=>`<span class="dots" aria-label="${T.of5(n)}">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`;

function renderTable(all){
  const s=sizesNow();
  $('compSub').textContent=s.length?T.compSub(s.length,fmt(all[0].total)):T.compEmpty;
  $('tbody').innerHTML=all.map(r=>{
    const sel=r.lv.id===state.level?' sel':'';
    if(!r.valid) return `<tr class="na${sel}" data-level="${r.lv.id}"><td class="lvname">${r.lv.name}</td><td colspan="8" class="na-reason">${T.unavailable} ${r.n?r.reason:T.noDrives}</td></tr>`;
    const eff=r.total?Math.round(r.usable/r.total*100):0;
    return `<tr class="${sel}" data-level="${r.lv.id}">
      <td class="lvname">${r.lv.name}${r.groups?` <span>(${r.groups} ${T.groupsShort})</span>`:''}</td>
      <td class="num"><strong>${fmt(r.usable)} TB</strong></td>
      <td class="num">${fmt(r.prot)} TB</td>
      <td class="num">${fmt(r.unused)} TB</td>
      <td class="num">${eff}%</td>
      <td>${bar(r,'minibar')}</td>
      <td>${r.ft}</td>
      <td>${dots(r.lv.read)}</td>
      <td>${dots(r.lv.write)}</td></tr>`;
  }).join('');
}

function render(){
  $('bays').value=state.bays;
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',+c.dataset.size===state.size));
  const all=LEVELS.map(l=>calc(l,sizesNow()));
  const cur=all.find(r=>r.lv.id===state.level);
  document.querySelectorAll('.lvl').forEach(b=>{
    const r=all.find(x=>x.lv.id===b.dataset.level);
    b.setAttribute('aria-pressed',b.dataset.level===state.level);
    b.classList.toggle('invalid',!r.valid);
  });
  renderBays(cur);renderResult(cur);renderTable(all);save();
}

buildStatic();
$('langSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.lang=b.dataset.lang;applyLang();render()});
$('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  state.size=+b.dataset.size;
  const i=state.drives.indexOf(null);
  if(i>=0) state.drives[i]=state.size;
  render();
});
$('baysGrid').addEventListener('click',e=>{
  const b=e.target.closest('.sled');if(!b)return;
  const i=+b.dataset.bay;
  state.drives[i]=state.drives[i]==null?state.size:null;
  const s=state.drives.filter(d=>d!=null);
  state.drives=s.concat(Array(state.bays-s.length).fill(null));
  render();
});
$('bays').addEventListener('change',e=>{
  const n=+e.target.value, s=sizesNow().slice(0,n);
  state.bays=n;state.drives=s.concat(Array(n-s.length).fill(null));render();
});
$('fill').addEventListener('click',()=>{state.drives=state.drives.map(d=>d==null?state.size:d);render()});
$('reset').addEventListener('click',()=>{state.drives=Array(state.bays).fill(null);render()});
$('levels').addEventListener('click',e=>{const b=e.target.closest('.lvl');if(!b)return;state.level=b.dataset.level;render()});
$('groups').addEventListener('change',e=>{state.groups[state.level]=+e.target.value;render()});
$('tbody').addEventListener('click',e=>{const tr=e.target.closest('tr');if(!tr)return;state.level=tr.dataset.level;render();if(window.innerWidth<900)$('h-rez').scrollIntoView({behavior:'smooth',block:'start'})});

if(!BAY_OPTS.includes(state.bays)){state.bays=BAY_OPTS.find(b=>b>=state.bays)||2}
if(state.drives.length!==state.bays){const s=sizesNow().slice(0,state.bays);state.drives=s.concat(Array(state.bays-s.length).fill(null))}
applyLang();render();
</script>
</body>
</html>
