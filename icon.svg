<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Calculator RAID</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A444F"/>
      <stop offset="0.25" stop-color="#2B333C"/>
      <stop offset="1" stop-color="#232A31"/>
    </linearGradient>
  </defs>

  <!-- chassis -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#body)"/>
  <rect x="24.5" y="24.5" width="463" height="463" rx="95.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- drive sleds -->
  <g>
    <rect x="74"  y="114" width="78" height="304" rx="14" fill="#46515D"/>
    <rect x="169" y="114" width="78" height="304" rx="14" fill="#46515D"/>
    <rect x="264" y="114" width="78" height="304" rx="14" fill="#46515D"/>
    <rect x="359" y="114" width="78" height="304" rx="14" fill="#46515D"/>
  </g>

  <!-- handles -->
  <g fill="#ffffff" fill-opacity="0.16">
    <rect x="94" y="128" width="38" height="8" rx="4"/>
    <rect x="189" y="128" width="38" height="8" rx="4"/>
    <rect x="284" y="128" width="38" height="8" rx="4"/>
    <rect x="379" y="128" width="38" height="8" rx="4"/>
  </g>

  <!-- fill: data (blue) + protection (amber) -->
  <g>
    <rect x="86"  y="152" width="54" height="250" rx="8" fill="#2E7DA6"/>
    <rect x="181" y="152" width="54" height="250" rx="8" fill="#2E7DA6"/>
    <rect x="276" y="152" width="54" height="250" rx="8" fill="#2E7DA6"/>
    <rect x="371" y="152" width="54" height="250" rx="8" fill="#D58F22"/>
  </g>

  <!-- status LEDs -->
  <g fill="#46C985">
    <circle cx="140" cy="98" r="7"/>
    <circle cx="235" cy="98" r="7"/>
    <circle cx="330" cy="98" r="7"/>
    <circle cx="425" cy="98" r="7"/>
  </g>
</svg>
